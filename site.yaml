    titulo: Antes de comprar
    preguntas:
      - { pregunta: "¿Cuánto tarda en llegar?", respuesta: "Si lo pides antes de las 13:00, sale del taller ese mismo día y llega en 48 horas a cualquier punto de la Península. A Baleares y Canarias, en cuatro o cinco días." }
      - { pregunta: "¿Puedo devolverlo si no me convence?", respuesta: "Sí. Tienes 30 días para devolverlo sin dar explicaciones. Te devolvemos el dinero en cuanto nos llega." }
      - { pregunta: "¿Qué cubre la garantía de por vida?", respuesta: "Cualquier defecto de forja, del acero o del mango. No cubre golpes, caídas ni el lavavajillas." }
      - { pregunta: "¿Cómo funciona el afilado gratis?", respuesta: "Durante el primer año, nos lo mandas o lo traes al taller y te lo devolvemos afilado en piedra sin coste. Después, el afilado tiene un precio fijo." }
      - { pregunta: "¿Se puede grabar un nombre en la hoja?", respuesta: "Sí, grabamos a láser hasta 20 letras en la hoja. Pídelo al hacer el pedido o por WhatsApp; tarda un día más." }

